name: Validate content and publishing output
on:
  push:
    branches: [main, feat/content-platform-v2]
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      - run: npm run build
      - name: Ensure generated publishing assets are current
        run: git diff --exit-code -- dist
